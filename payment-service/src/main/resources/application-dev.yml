# Dev profile: in-memory H2 in PostgreSQL compatibility mode and no RabbitMQ,
# so the full payment flow (including the simulated provider webhook) runs on
# a machine without Docker. Never used in prod.
spring:
  datasource:
    url: jdbc:h2:mem:payflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

payflow:
  messaging:
    enabled: false
  security:
    jwt-secret: dev-only-insecure-jwt-secret
    admin-password: demo-admin
  webhook:
    secret: dev-only-insecure-webhook-secret
  provider:
    delay: 250ms
